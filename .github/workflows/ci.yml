name: CI

# The repository is private, so Actions minutes are billed, and macOS minutes cost about ten times
# Linux ones. To stay inside the monthly allowance:
# - pull requests and pushes to other branches: Linux and Windows only (typecheck, unit tests,
#   generated docs, FFmpeg self-test, app build)
# - pushes to main, the weekly run and manual runs: macOS (Apple silicon) too
# - weekly (Sunday) and manual runs: the full suite, with the render and model integration tests
# - a newer run on the same branch cancels the older one, and every job has a time limit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (${{ matrix.name }})
    # Pull requests skip macOS: see the note at the top.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"Windows x64","os":"windows-latest"},{"name":"Ubuntu 22.04 x64","os":"ubuntu-22.04"}]' || '[{"name":"Windows x64","os":"windows-latest"},{"name":"macOS arm64","os":"macos-14"},{"name":"Ubuntu 22.04 x64","os":"ubuntu-22.04"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 40 || 15 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Optional dependencies (ffmpeg-static, onnxruntime-node, resvg) must install on every target.
      - run: npm ci
      - run: npx tsc --noEmit
      - name: FFmpeg self-test
        run: npx tsx src/cli.ts check
      - run: npm run docs:check
      - name: Unit tests
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npx vitest run --exclude "**/*.integration.test.ts"
      - name: All tests, with renders and models
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm test
      - name: Keep test renders
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ matrix.os }}
          path: test/.output
          if-no-files-found: ignore
          retention-days: 7

  app:
    name: Desktop app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"Windows x64","os":"windows-latest"},{"name":"Ubuntu 22.04 x64","os":"ubuntu-22.04"}]' || '[{"name":"Windows x64","os":"windows-latest"},{"name":"macOS arm64","os":"macos-14"},{"name":"Ubuntu 22.04 x64","os":"ubuntu-22.04"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build app/VideoEditor
